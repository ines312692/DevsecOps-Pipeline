# Falco configuration file
rules_file:
  - /etc/falco/falco_rules.yml
  - /etc/falco/falco_rules.local.yml
  - /etc/falco/k8s_audit_rules.yml
  - /etc/falco/rules.d

time_format_iso_8601: false
json_output: true
json_include_output_property: true

log_stderr: true
log_syslog: true
log_level: info

priority: debug

buffered_outputs: false

syscall_event_drops:
  actions:
    - log
    - alert
  rate: 0.03333
  max_burst: 1000

outputs:
  rate: 1
  max_burst: 1000

syslog_output:
  enabled: true

file_output:
  enabled: true
  keep_alive: false
  filename: /var/log/falco.log

stdout_output:
  enabled: true

webserver:
  enabled: true
  listen_port: 8765
  k8s_healthz_endpoint: /healthz
  ssl_enabled: false

grpc:
  enabled: false
  bind_address: "0.0.0.0:5060"
  threadiness: 8

grpc_output:
  enabled: false