falco:
  grpc:
    enabled: true
    listen_port: 5555
  
  grpc_output:
    enabled: true

  json_output: true
  
  file_output:
    enabled: true
    keep_alive: false
    filename: ./events.txt

  syslog_output:
    enabled: false

  stdout_output:
    enabled: true

rules_file:
  - /etc/falco/rules.d/

plugins:
  - name: cloudtrail
    library_path: libcloudtrail.so
    init_config: ""
    open_params: ""
  - name: json
    library_path: libjson.so
    init_config: ""
    open_params: ""

load_plugins: [cloudtrail, json]