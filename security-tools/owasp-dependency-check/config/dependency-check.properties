# OWASP Dependency Check configuration
analyzer.assembly.enabled=true
analyzer.msbuild.enabled=true
analyzer.nuspec.enabled=true
analyzer.composer.enabled=true
analyzer.python.distribution.enabled=true
analyzer.python.package.enabled=true
analyzer.ruby.gemspec.enabled=true
analyzer.node.package.enabled=true
analyzer.retirejs.enabled=true

# Database settings
data.directory=/opt/dependency-check-data
database.driver.name=org.h2.Driver
database.url=jdbc:h2:file:/opt/dependency-check-data/odc

# NVD API settings
nvd.api.endpoint=https://services.nvd.nist.gov/rest/json/cves/1.0/
nvd.api.datafeed.url=https://nvd.nist.gov/feeds/json/cve/1.1/

# Output settings
format=ALL
output.directory=/tmp/security-reports
output.prettyPrint=true

# Suppression file
suppression.file=/opt/dependency-check/suppressions.xml

# Fail build on CVSS score
failBuildOnCVSS=7.0