# SonarQube project configuration
sonar.projectKey=devsecops-pipeline
sonar.projectName=DevSecOps Pipeline
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.tests=tests
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Language-specific settings
sonar.java.source=11
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# Quality gate settings
sonar.qualitygate.wait=true

# Security hotspot settings
sonar.security.hotspots.inheritance=true

# Coverage exclusions
sonar.coverage.exclusions=**/*Test.java,**/*IT.java,**/test/**,**/tests/**

# Duplication exclusions
sonar.cpd.exclusions=**/*Test.java,**/*IT.java

# Analysis parameters
sonar.analysis.mode=publish
sonar.buildString=${BUILD_NUMBER}
sonar.scm.provider=git