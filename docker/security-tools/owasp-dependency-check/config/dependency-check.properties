# Dependency-Check Properties

# Proxy Configuration
# proxy.url=http://proxy.example.com:8080
# proxy.username=username
# proxy.password=password

# NVD Configuration
nvd.api.key=
nvd.api.delay=5000

# Database Configuration
data.directory=./dependency-check-data

# Reporting
report.format=json,html
report.outputdirectory=./reports

# Analyzer Configuration
analyzers.enabled=true
analyzer.jar.enabled=true
analyzer.archive.enabled=true
analyzer.assembly.enabled=false
analyzer.msbuild.enabled=false
analyzer.pip.enabled=false
analyzer.ruby.enabled=false
analyzer.node.enabled=true
analyzer.retirejs.enabled=true

# Exclusions
# exclusions=**/test/**,**/samples/**

# Severity level for failing
cvss.score=7.0