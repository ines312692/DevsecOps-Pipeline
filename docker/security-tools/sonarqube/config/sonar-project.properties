# Project Information
sonar.projectKey=devsecops-pipeline
sonar.projectName=DevSecOps Pipeline
sonar.projectVersion=1.0.0

# Source Encoding
sonar.sourceEncoding=UTF-8

# Sources
sonar.sources=src
sonar.tests=src/test
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar

# Coverage
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Exclusions
sonar.exclusions=**/target/**,**/test/**

# Issue tracking
sonar.links.homepage=https://github.com/yourorg/devsecops-pipeline
sonar.links.scm=https://github.com/yourorg/devsecops-pipeline
sonar.links.issue_tracker=https://jira.example.com

# Quality Gate
sonar.qualitygate=Sonar%20way